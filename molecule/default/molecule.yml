---
#
# Ansible managed
#
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
lint: |
  set -e
  yamllint .
  ansible-lint
driver:
  name: docker
platforms:
  - name: "openvpn-${image:-fedora}-${tag:-latest}"
    image: "${namespace:-buluma}/${image:-fedora}:${tag:-latest}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # openvpn needs a tun device to start at all - privileged: true alone
    # grants the capability but doesn't create the device node.
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
